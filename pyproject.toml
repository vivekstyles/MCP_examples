[project]
name = "mcp-deepdive"
version = "0.1.0"
description = "Comprehensive guide and runnable examples demonstrating Model Context Protocol (MCP) with local Ollama agents"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "mcp>=1.2.0",
    "ollama>=0.4.0",
    "httpx>=0.27.0",
    "pydantic>=2.0",
    "rich>=13.0",
    "pytest>=8.0",
    "pytest-asyncio>=0.23.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
